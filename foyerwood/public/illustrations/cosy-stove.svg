<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t">
  <title id="t">Une petite fille bien au chaud près du poêle</title>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stove" x1="0" x2="1">
      <stop offset="0" stop-color="#2a2828"/>
      <stop offset=".55" stop-color="#3b3838"/>
      <stop offset="1" stop-color="#232121"/>
    </linearGradient>
    <radialGradient id="fireLight" cx="0.5" cy="0.85" r="0.75">
      <stop offset="0" stop-color="#ff9a1e" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#7a2e0c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#161515" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blanket" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fdf6ea"/>
      <stop offset="1" stop-color="#efe2cd"/>
    </linearGradient>
    <clipPath id="window"><path d="M424 352 V292 A56 50 0 0 1 536 292 V352 Z"/></clipPath>
  </defs>
  <style>
    .glow { animation: glow 3.4s ease-in-out infinite; }
    .f1 { animation: f1 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .f2 { animation: f2 .9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .f3 { animation: f1 .7s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: 50% 100%; }
    .spark { animation: spark 2.6s ease-out infinite; opacity: 0; }
    .spark.b { animation-delay: .9s; } .spark.c { animation-delay: 1.7s; }
    .breathe { animation: breathe 4.2s ease-in-out infinite; transform-box: view-box; transform-origin: 252px 372px; }
    .steam path { animation: steam 3s ease-in-out infinite; opacity: 0; }
    .steam path:nth-child(2) { animation-delay: 1s; } .steam path:nth-child(3) { animation-delay: 2s; }
    @keyframes glow { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
    @keyframes f1 { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(.94, 1.08); } 60% { transform: scale(1.04, .95); } }
    @keyframes f2 { 0%, 100% { transform: scale(1, 1) skewX(0deg); } 40% { transform: scale(.92, 1.12) skewX(-4deg); } 70% { transform: scale(1.05, .93) skewX(3deg); } }
    @keyframes spark { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -46px); } }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.012); } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .8; } 100% { opacity: 0; transform: translateY(-22px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .spark, .steam path { opacity: .6; } }
  </style>

  <!-- warm light -->
  <ellipse class="glow" cx="420" cy="320" rx="250" ry="150" fill="url(#glow)"/>

  <!-- rug -->
  <ellipse cx="330" cy="398" rx="300" ry="32" fill="#efe5d6"/>
  <ellipse cx="330" cy="398" rx="270" ry="24" fill="none" stroke="#e2d3bd" stroke-width="3" stroke-dasharray="10 9"/>

  <!-- ===== our stove ===== -->
  <rect x="466" y="-10" width="28" height="210" fill="#3a3636"/>
  <rect x="462" y="150" width="36" height="10" rx="3" fill="#2a2828"/>
  <rect x="458" y="190" width="44" height="16" rx="4" fill="#2a2828"/>
  <rect x="412" y="368" width="14" height="24" rx="3" fill="#232121"/>
  <rect x="534" y="368" width="14" height="24" rx="3" fill="#232121"/>
  <rect x="400" y="218" width="160" height="156" rx="20" fill="url(#stove)"/>
  <rect x="388" y="204" width="184" height="18" rx="7" fill="#433f3f"/>
  <path d="M424 352 V292 A56 50 0 0 1 536 292 V352 Z" fill="#161515"/>
  <g clip-path="url(#window)">
    <rect x="420" y="240" width="120" height="120" fill="url(#fireLight)"/>
    <!-- logs -->
    <rect x="436" y="334" width="88" height="15" rx="7.5" fill="#7a4e30" transform="rotate(-6 480 341)"/>
    <rect x="438" y="336" width="86" height="14" rx="7" fill="#8f5f3c" transform="rotate(7 480 343)"/>
    <circle cx="440" cy="347" r="7" fill="#e9c48a"/>
    <circle cx="522" cy="346" r="7" fill="#e9c48a"/>
    <!-- flames -->
    <path class="f1" d="M480 268 C500 292 516 306 514 324 C512 340 498 346 480 346 C462 346 448 340 446 324 C444 304 466 296 470 280 C474 290 476 296 480 300 C482 290 480 280 480 268 Z" fill="#f2711c"/>
    <path class="f2" d="M482 290 C496 306 504 316 503 328 C502 340 494 344 482 344 C470 344 460 339 460 328 C460 316 472 310 474 300 C477 308 479 312 482 314 C484 306 483 298 482 290 Z" fill="#ffa531"/>
    <path class="f3" d="M482 312 C490 320 494 326 493 333 C492 340 488 343 482 343 C476 343 471 340 471 333 C471 326 477 322 478 316 C480 320 481 322 482 323 C483 320 483 316 482 312 Z" fill="#ffe2a0"/>
    <circle class="spark" cx="474" cy="292" r="2" fill="#ffd27a"/>
    <circle class="spark b" cx="490" cy="300" r="1.6" fill="#ffd27a"/>
    <circle class="spark c" cx="482" cy="286" r="1.8" fill="#ffd27a"/>
    <path d="M436 300 C440 284 452 272 466 266" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".12"/>
  </g>
  <path d="M424 352 V292 A56 50 0 0 1 536 292 V352 Z" fill="none" stroke="#4a4646" stroke-width="5"/>
  <rect x="440" y="358" width="80" height="6" rx="3" fill="#4a4646"/>
  <rect x="542" y="300" width="7" height="24" rx="3" fill="#6b6560"/>

  <!-- log basket -->
  <path d="M572 344 L630 344 L622 394 L580 394 Z" fill="#c98f4c"/>
  <g stroke="#a8713a" stroke-width="2.5" opacity=".8">
    <path d="M574 358 H628"/><path d="M576 372 H626"/><path d="M578 386 H624"/>
  </g>
  <g>
    <circle cx="588" cy="338" r="11" fill="#e9c48a" stroke="#7a4e30" stroke-width="3"/>
    <circle cx="612" cy="336" r="12" fill="#f0d3a0" stroke="#7a4e30" stroke-width="3"/>
    <circle cx="600" cy="320" r="11" fill="#e9c48a" stroke="#7a4e30" stroke-width="3"/>
    <g fill="none" stroke="#d8a565" stroke-width="1.4">
      <circle cx="588" cy="338" r="5"/><circle cx="612" cy="336" r="6"/><circle cx="600" cy="320" r="5"/>
    </g>
  </g>

  <!-- ===== the girl ===== -->
  <!-- floor cushion -->
  <ellipse cx="252" cy="378" rx="104" ry="24" fill="#c9b49a"/>
  <ellipse cx="252" cy="370" rx="100" ry="22" fill="#dcc8ad"/>
  <circle cx="252" cy="370" r="3" fill="#b89d7e"/>

  <g class="breathe">
    <!-- hair behind -->
    <circle cx="246" cy="206" r="43" fill="#4a2f22"/>
    <circle cx="222" cy="162" r="18" fill="#4a2f22"/>
    <rect x="226" y="170" width="16" height="7" rx="3.5" fill="#f39a1e" transform="rotate(-28 234 173)"/>

    <!-- blanket wrapped body -->
    <path d="M196 262 C188 300 172 340 150 370 L354 370 C334 340 318 300 308 262 C298 238 206 238 196 262 Z" fill="url(#blanket)" stroke="#e2d2ba" stroke-width="2.5"/>
    <g fill="none" stroke="#f39a1e" stroke-width="5" stroke-linecap="round" opacity=".85">
      <path d="M186 300 C226 290 278 290 318 300"/>
      <path d="M172 336 C226 324 284 324 336 336"/>
    </g>
    <g fill="none" stroke="#e7d6bd" stroke-width="2.5" stroke-linecap="round">
      <path d="M200 316 C230 310 276 310 304 316"/>
      <path d="M182 352 C226 346 282 346 326 352"/>
    </g>

    <!-- head -->
    <rect x="240" y="236" width="24" height="16" rx="6" fill="#e7b48f"/>
    <circle cx="252" cy="212" r="35" fill="#f2c7a2"/>
    <path d="M216 206 C218 178 240 166 262 170 C280 174 290 188 288 204 C276 194 262 188 246 192 C236 194 226 200 216 206 Z" fill="#4a2f22"/>
    <path d="M286 200 C290 214 290 226 284 234" fill="none" stroke="#4a2f22" stroke-width="7" stroke-linecap="round"/>
    <!-- face: content, eyes closed -->
    <path d="M232 216 Q239 223 246 216" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round"/>
    <path d="M258 216 Q265 223 272 216" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round"/>
    <circle cx="230" cy="230" r="7" fill="#f2836b" opacity=".45"/>
    <circle cx="274" cy="230" r="7" fill="#f2836b" opacity=".45"/>
    <path d="M246 236 Q252 242 258 236" fill="none" stroke="#3a2a22" stroke-width="2.6" stroke-linecap="round"/>

    <!-- mug held in both hands -->
    <g class="steam" fill="none" stroke="#c8b8a6" stroke-width="2.6" stroke-linecap="round">
      <path d="M262 258 C256 250 268 244 262 236"/>
      <path d="M272 256 C266 248 278 242 272 234"/>
      <path d="M282 258 C276 250 288 244 282 236"/>
    </g>
    <rect x="258" y="264" width="34" height="34" rx="7" fill="#f39a1e"/>
    <path d="M292 272 C304 272 304 290 292 290" fill="none" stroke="#e2870f" stroke-width="5"/>
    <rect x="262" y="264" width="26" height="5" rx="2.5" fill="#6b3d1f"/>
    <ellipse cx="258" cy="286" rx="10" ry="9" fill="#f2c7a2"/>
    <ellipse cx="292" cy="290" rx="9" ry="8" fill="#f2c7a2"/>
    <path d="M226 270 C236 286 246 290 256 288" fill="none" stroke="#fdf6ea" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
